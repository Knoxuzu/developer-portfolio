<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
    <title>Midground Cloud Clusters</title>
    <desc>Stylized layered cloud formations drifting around the floating island and gateway.</desc>
    <defs>
        <linearGradient id="cluster-cloud-body" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="75%" stop-color="#EFF6FC" />
            <stop offset="100%" stop-color="#D7E7F5" />
        </linearGradient>

        <linearGradient id="cluster-cloud-shade" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#DCEAF6" />
            <stop offset="100%" stop-color="#C1D8EC" />
        </linearGradient>
    </defs>

    <g id="cloud-cluster-left">
        <path d="M 45 165 Q 45 130 80 128 Q 92 92 135 94 Q 172 72 212 98 Q 252 96 265 132 Q 295 138 295 165 Z"
            fill="url(#cluster-cloud-body)" />
        <path d="M 52 165 L 288 165 Q 275 182 245 182 L 85 182 Q 60 182 52 165 Z" fill="url(#cluster-cloud-shade)"
            opacity="0.75" />
    </g>

    <g id="cloud-cluster-right">
        <path
            d="M 325 135 Q 325 104 356 102 Q 370 72 408 75 Q 442 58 475 82 Q 512 82 525 114 Q 552 118 552 142 L 332 142 Q 325 140 325 135 Z"
            fill="url(#cluster-cloud-body)" />
        <path d="M 332 142 L 552 142 Q 540 156 512 156 L 360 156 Q 340 156 332 142 Z" fill="url(#cluster-cloud-shade)"
            opacity="0.7" />
    </g>
</svg>