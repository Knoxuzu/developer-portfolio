<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%"
    preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="sky-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#DCEBF7" />
            <stop offset="45%" stop-color="#EEF6FC" />
            <stop offset="85%" stop-color="#F8FBFE" />
            <stop offset="100%" stop-color="#FFFFFF" />
        </linearGradient>

        <radialGradient id="zenith-glow" cx="50%" cy="35%" r="55%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
            <stop offset="60%" stop-color="#E3F0FA" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#DCEBF7" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="horizon-haze" x1="0%" y1="70%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#D4E6F5" stop-opacity="0" />
            <stop offset="100%" stop-color="#C8DFF2" stop-opacity="0.45" />
        </linearGradient>
    </defs>

    <g id="sky-layer">
        <rect id="sky-base" width="1920" height="1080" fill="url(#sky-gradient)" />
        <rect id="sky-glow" width="1920" height="1080" fill="url(#zenith-glow)" />
        <rect id="sky-horizon" width="1920" height="1080" fill="url(#horizon-haze)" />
    </g>
</svg>