<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="100%" height="100%">
    <title>Main Island Ambient Shadow</title>
    <desc>Soft diffused shadow layer beneath the main floating island to reinforce elevation.</desc>
    <defs>
        <radialGradient id="island-drop-shadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2B333E" stop-opacity="0.22" />
            <stop offset="55%" stop-color="#6E88A3" stop-opacity="0.11" />
            <stop offset="100%" stop-color="#DCEAF6" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="island-core-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3B4959" stop-opacity="0.24" />
            <stop offset="100%" stop-color="#3B4959" stop-opacity="0" />
        </linearGradient>
    </defs>

    <g id="island-shadow-group">
        <ellipse id="island-aura-shadow" cx="700" cy="495" rx="460" ry="62" fill="url(#island-drop-shadow)" />
        <polygon id="island-spire-shadow" points="540,465 860,465 710,565" fill="url(#island-core-shadow)" />
    </g>
</svg>