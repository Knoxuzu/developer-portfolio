<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
    <defs>
        <linearGradient id="ring-metal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="50%" stop-color="#D7E2EC" />
            <stop offset="100%" stop-color="#9EB0C2" />
        </linearGradient>
    </defs>

    <g id="portal-inner-ring" transform="translate(400, 420)">

        <circle cx="0" cy="0" r="218" fill="none" stroke="#2B333E" stroke-width="10" />
        <circle cx="0" cy="0" r="206" fill="none" stroke="url(#ring-metal)" stroke-width="14" />

        <g id="ring-ticks">
            <circle cx="0" cy="0" r="192" fill="none" stroke="#5CA8E6" stroke-width="2.5" stroke-dasharray="45 22 8 22"
                opacity="0.85" />
            <circle cx="0" cy="0" r="182" fill="none" stroke="#2B333E" stroke-width="1.5" stroke-dasharray="4 16"
                opacity="0.6" />
        </g>

        <g id="ring-brackets" fill="#2B333E">
            <rect x="-8" y="-224" width="16" height="24" rx="2" />
            <rect x="-8" y="200" width="16" height="24" rx="2" />
            <rect x="-224" y="-8" width="24" height="16" rx="2" />
            <rect x="200" y="-8" width="24" height="16" rx="2" />
        </g>

        <circle cx="0" cy="0" r="176" fill="none" stroke="#FFFFFF" stroke-width="3" />
    </g>
</svg>