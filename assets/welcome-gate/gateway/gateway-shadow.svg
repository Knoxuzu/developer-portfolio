<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
    <title>Gateway Ground Shadow</title>
    <desc>Subtle contact shadow cast directly beneath the hexagonal gateway base.</desc>
    <defs>
        <radialGradient id="gateway-contact-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2B333E" stop-opacity="0.34" />
            <stop offset="65%" stop-color="#4A5B6E" stop-opacity="0.14" />
            <stop offset="100%" stop-color="#4A5B6E" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="gateway-portal-cast" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0" />
        </linearGradient>
    </defs>

    <g id="gateway-shadow-group">
        <ellipse id="gateway-portal-bounce" cx="400" cy="842" rx="165" ry="18" fill="url(#gateway-portal-cast)" />
        <ellipse id="gateway-base-shadow" cx="400" cy="852" rx="265" ry="22" fill="url(#gateway-contact-grad)" />
    </g>
</svg>