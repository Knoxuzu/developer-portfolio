<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
    <defs>
        <radialGradient id="portal-core-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
            <stop offset="45%" stop-color="#D9F0FF" stop-opacity="0.9" />
            <stop offset="80%" stop-color="#9BD4FA" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#69B7F0" stop-opacity="0.95" />
        </radialGradient>

        <radialGradient id="portal-rim-glow" cx="50%" cy="50%" r="50%">
            <stop offset="75%" stop-color="#7CC4FA" stop-opacity="0" />
            <stop offset="94%" stop-color="#BCE3FF" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
        </radialGradient>

        <clipPath id="portal-aperture-clip">
            <circle cx="400" cy="420" r="175" />
        </clipPath>
    </defs>

    <g id="portal-glow" clip-path="url(#portal-aperture-clip)">

        <circle cx="400" cy="420" r="175" fill="url(#portal-core-grad)" />

        <g id="portal-depth-rings" fill="none" stroke="#FFFFFF">
            <circle cx="400" cy="420" r="145" stroke-width="1" stroke-opacity="0.45" />
            <circle cx="400" cy="420" r="110" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="12 8" />

            <polygon points="400,265 534,342 534,497 400,575 266,497 266,342" stroke-width="1" stroke-opacity="0.3" />
        </g>

        <polygon points="240,220 330,220 520,620 430,620" fill="#FFFFFF" opacity="0.22" />

        <circle cx="400" cy="420" r="175" fill="url(#portal-rim-glow)" />
    </g>
</svg>